# render.yaml - Deploy to Render for FREE
# Place this in the root of your repository

services:
  # Coordinator service
  - type: web
    name: ollama-coordinator
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python coordinator/server.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    
  # Proxy service  
  - type: web
    name: ollama-proxy
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python proxy/server.py --coordinator https://ollama-coordinator.onrender.com --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

# Note: Free tier apps sleep after 15 minutes of inactivity
# They wake up automatically when a request comes in (~30 second delay)
# Render automatically assigns PORT environment variable
